<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>숨바꼭질</title>
  <link rel="stylesheet" href="./styles.css">
  <!-- Three.js는 서버가 node_modules/three/build/의 고정 파일만 제공한다(외부 CDN 없음). import map은 모듈 스크립트보다 먼저 둔다. -->
  <script type="importmap">
    { "imports": { "three": "/vendor/three/three.module.js" } }
  </script>
  <script type="module" src="./main.js"></script>
</head>
<body>
  <div class="layout">
    <main class="stage-area">
      <div class="stage" id="stage">
        <canvas class="stage-canvas" id="stage-canvas" aria-label="숨바꼭질 화면"></canvas>
        <p class="stage-message" id="stage-message" role="alert" hidden></p>
        <p class="stage-warning" id="stage-warning" role="status" hidden></p>
      </div>
    </main>

    <aside class="panel" id="dev-panel" hidden>
      <p class="panel-badge">개발용 모의 입력 — 최종 센서 연동 아님</p>

      <section class="controls" aria-labelledby="controls-title">
        <h2 id="controls-title">모의 입력</h2>

        <div class="field">
          <label for="distance">관객 거리 <output id="distance-value" for="distance">-</output></label>
          <input type="range" id="distance">
          <p class="hint" id="threshold-hint">-</p>
          <div class="buttons">
            <button type="button" data-action="near">가까이 (N)</button>
            <button type="button" data-action="mid">중간 (M)</button>
            <button type="button" data-action="far">멀리 (F)</button>
          </div>
        </div>

        <div class="field">
          <p class="field-title">입력 상태: <strong id="input-mode">-</strong></p>
          <div class="buttons">
            <button type="button" data-action="no-target">감지 없음</button>
            <button type="button" data-action="error">입력 오류</button>
            <button type="button" data-action="stop">전송 중단</button>
            <button type="button" data-action="resume" class="primary">정상 입력 재개</button>
          </div>
          <p class="hint">감지 없음은 대상이 없는 정상 샘플(= 원거리, 기본 놀이)입니다. 입력 오류·전송 중단은 안전 정지(H)로 갑니다.</p>
        </div>
      </section>

      <section class="controls" aria-labelledby="render-title">
        <h2 id="render-title">화면</h2>
        <div class="checks">
          <label><input type="checkbox" id="oil-toggle"> 유화 필터 (O)</label>
          <label><input type="checkbox" id="compare-toggle"> 원본 비교 (왼쪽 절반 원본)</label>
        </div>
        <p class="hint">단축키: N 가까이 · M 중간 · F 멀리 · O 유화 · D 패널 표시 전환. 주소에 ?debug=1을 붙이면 패널이 열린 채 시작합니다.</p>
      </section>

      <details class="diagnostics" id="diagnostics" open>
        <summary>진단</summary>
        <dl id="diag-list"></dl>
      </details>
    </aside>
  </div>
</body>
</html>
